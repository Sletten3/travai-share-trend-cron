name: Share trend poll
on:
  schedule:
    # Re-kick every 2h; each run samples every 5 min for ~2h (no PC needed)
    - cron: "5 */2 * * *"
  workflow_dispatch:
concurrency:
  group: share-trend-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Poll TravAi share trend every 5 minutes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET mangler"
            exit 1
          fi
          end=$((SECONDS + 2 * 60 * 60 - 30))
          n=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            echo "poll #$n $(date -u +%H:%M:%S)"
            curl -fsS --max-time 100 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://trav-innsamling.vercel.app/api/cron/share-trend?sync=1" \
              || echo "poll failed (continues)"
            if [ "$SECONDS" -ge "$end" ]; then
              break
            fi
            sleep 300
          done