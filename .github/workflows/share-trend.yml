name: Share trend poll
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: share-trend-poll
  cancel-in-progress: true
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll TravAi share trend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET mangler"
            exit 1
          fi
          curl -fsS --max-time 100 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trav-innsamling.vercel.app/api/cron/share-trend?sync=1"