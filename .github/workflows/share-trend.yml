name: Share trend poll

on:
  schedule:
    # Single-shot every 5 minutes. Do NOT use a multi-hour loop with a shared
    # concurrency queue — that piled up delayed kicks and left real gaps.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: share-trend-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll TravAi share trend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET mangler"
            exit 1
          fi
          echo "poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --max-time 100 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trav-innsamling.vercel.app/api/cron/share-trend?sync=1"
